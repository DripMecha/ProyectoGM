<header class="navbar">
  <a routerLink="/" class="marca" (click)="cerrarMenu()">
    <img src="/image/GenuineMotors_Logo.jpg" alt="Logo Genuine Motors Parts">
    <span>Genuine Motors Parts</span>
  </a>

  <!-- Botón de hamburguesa (solo se ve en pantallas pequeñas) -->
  <button class="hamburguesa" type="button" aria-label="Abrir o cerrar el menú"
          [attr.aria-expanded]="menuAbierto" (click)="alternarMenu()">
    <span></span><span></span><span></span>
  </button>

  <nav class="enlaces" [class.abierto]="menuAbierto" aria-label="Navegación principal">
    @for (e of enlaces; track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="activo"
         [routerLinkActiveOptions]="{ exact: e.ruta === '/' }"
         (click)="cerrarMenu()">{{ e.texto }}</a>
    }

    <div class="sesion">
      @if (auth.estaLogueado) {
        @if (auth.esAdmin) {
          <a routerLink="/admin" class="btn btn-borde" (click)="cerrarMenu()">Panel admin</a>
        }
        <button type="button" class="btn btn-rojo" (click)="cerrarSesion()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" class="btn btn-borde" (click)="cerrarMenu()">Iniciar sesión</a>
      }
    </div>
  </nav>
</header>
