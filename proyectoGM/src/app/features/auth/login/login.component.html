<app-header />

<main class="login-fondo">
  <form class="card" #f="ngForm" (ngSubmit)="ingresar(f)" novalidate>
    <!-- Usa el mismo nombre de logo que ya tenías en el login anterior -->
    <img class="logo-card" src="/image/GenuineMotors_Logo.jpg" alt="Genuine Motors Parts">

    <a routerLink="/" class="volver">&larr; Volver al inicio</a>
    <h2>Iniciar sesión</h2>
    <p class="sub">Ingresa con tu cuenta para continuar.</p>

    <label class="campo">
      <span>Correo electrónico</span>
      <input type="email" name="email" [(ngModel)]="email" #correo="ngModel"
             required email autocomplete="username" placeholder="correo@ejemplo.com">
      <small class="msg" *ngIf="correo.invalid && (correo.touched || f.submitted)">
        Ingresa un correo válido.
      </small>
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <div class="con-boton">
        <input [type]="verPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
               #clave="ngModel" required minlength="4" autocomplete="current-password"
               placeholder="Tu contraseña">
        <button type="button" class="ojo" (click)="verPassword = !verPassword"
                [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          {{ verPassword ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
      <small class="msg" *ngIf="clave.invalid && (clave.touched || f.submitted)">
        Ingresa tu contraseña.
      </small>
    </label>

    <div class="error" *ngIf="error" role="alert">{{ error }}</div>

    <button class="btn" type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando…' : 'Ingresar' }}
    </button>

    <!-- BORRAR antes de la sustentación -->
    <p class="demo">
      Cuentas de prueba:<br>
      <strong>admin&#64;gm.com</strong> / admin123 (administrador)<br>
      <strong>usuario&#64;gm.com</strong> / usuario123 (usuario)
    </p>
  </form>
</main>

<app-footer />
